<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2010" width="1200" height="2010" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title>Ladder FSM de llenado v1 — Piloto 1 tina</title>
  <style>
    .h { font-size: 22px; font-weight: 700; fill: #111; }
    .sub { font-size: 13px; fill: #555; }
    .ttl { font-size: 15px; font-weight: 700; fill: #111; }
    .cm { font-size: 13px; fill: #777; font-style: italic; }
    .ad { font-size: 13px; font-weight: 700; fill: #111; text-anchor: middle; }
    .sy { font-size: 11px; fill: #666; text-anchor: middle; }
    .bk { font-size: 14px; font-weight: 700; fill: #111; text-anchor: middle; font-family: Consolas, "Courier New", monospace; }
    .bs { font-size: 12px; fill: #333; text-anchor: middle; }
    .pin { font-size: 11px; fill: #333; }
    .w { stroke: #222; stroke-width: 2; fill: none; }
    .k { stroke: #111; stroke-width: 2.6; fill: none; }
    .rail { stroke: #1b5e20; stroke-width: 5; }
    .sep { stroke: #ddd; stroke-width: 1; }
    .cmp { fill: #e8f1fb; stroke: #1565c0; stroke-width: 1.8; }
    .op { fill: #fff4e5; stroke: #e67e22; stroke-width: 1.8; }
    .tm { fill: #eef7ee; stroke: #2e7d32; stroke-width: 1.8; }
  </style>

  <rect x="0" y="0" width="1200" height="2010" fill="#ffffff"/>
  <text x="60" y="40" class="h">FSM de llenado v1 — Diagrama ladder (Machine Expert Basic)</text>
  <text x="60" y="62" class="sub">POU "Latex pools" · TM221CE16R · Estados %MW0: 0 = ESPERA · 1 = LLENANDO · 2 = FALLA</text>

  <!-- Leyenda -->
  <g transform="translate(60,95)">
    <line x1="0" y1="0" x2="40" y2="0" class="w"/>
    <rect x="13" y="-12" width="14" height="24" fill="#fff"/>
    <line x1="13" y1="-12" x2="13" y2="12" class="k"/><line x1="27" y1="-12" x2="27" y2="12" class="k"/>
    <text x="48" y="5" class="pin">Contacto NA</text>

    <line x1="150" y1="0" x2="190" y2="0" class="w"/>
    <rect x="163" y="-12" width="14" height="24" fill="#fff"/>
    <line x1="163" y1="-12" x2="163" y2="12" class="k"/><line x1="177" y1="-12" x2="177" y2="12" class="k"/>
    <line x1="160" y1="10" x2="180" y2="-10" class="k"/>
    <text x="198" y="5" class="pin">Contacto NC (negado)</text>

    <line x1="340" y1="0" x2="380" y2="0" class="w"/>
    <rect x="346" y="-13" width="28" height="26" fill="#fff"/>
    <path d="M352 -12 A12 12 0 0 0 352 12" class="k"/><path d="M368 -12 A12 12 0 0 1 368 12" class="k"/>
    <text x="388" y="5" class="pin">Bobina</text>

    <rect x="460" y="-12" width="70" height="24" class="cmp"/>
    <text x="538" y="5" class="pin">Comparación</text>

    <rect x="640" y="-12" width="70" height="24" class="op"/>
    <text x="718" y="5" class="pin">Operación (asignar)</text>

    <rect x="860" y="-12" width="70" height="24" class="tm"/>
    <text x="938" y="5" class="pin">Timer %TM</text>
  </g>

  <!-- Rieles -->
  <line x1="60" y1="140" x2="60" y2="1885" class="rail"/>
  <line x1="1140" y1="140" x2="1140" y2="1885" class="rail"/>

  <!-- ============ Rung 0 ============ -->
  <line x1="60" y1="140" x2="1140" y2="140" class="sep"/>
  <text x="80" y="164" class="ttl">Rung 0 — Inicialización</text>
  <text x="420" y="164" class="cm">Primer ciclo en RUN → estado ESPERA</text>
  <line x1="60" y1="200" x2="880" y2="200" class="w"/><line x1="1110" y1="200" x2="1140" y2="200" class="w"/>
  <rect x="173" y="186" width="14" height="28" fill="#fff"/>
  <line x1="173" y1="186" x2="173" y2="214" class="k"/><line x1="187" y1="186" x2="187" y2="214" class="k"/>
  <text x="180" y="180" class="ad">%S13</text><text x="180" y="230" class="sy">1er ciclo</text>
  <rect x="880" y="184" width="230" height="32" class="op"/><text x="995" y="205" class="bk">%MW0 := 0</text>

  <!-- ============ Rung 1 ============ -->
  <line x1="60" y1="265" x2="1140" y2="265" class="sep"/>
  <text x="80" y="289" class="ttl">Rung 1 — Sensor capacitivo</text>
  <text x="420" y="289" class="cm">Si con líquido %I0.0 = 0, cambiar a contacto NC SOLO aquí</text>
  <line x1="60" y1="325" x2="1140" y2="325" class="w"/>
  <rect x="173" y="311" width="14" height="28" fill="#fff"/>
  <line x1="173" y1="311" x2="173" y2="339" class="k"/><line x1="187" y1="311" x2="187" y2="339" class="k"/>
  <text x="180" y="305" class="ad">%I0.0</text><text x="180" y="355" class="sy">CAP_NIVEL</text>
  <rect x="1046" y="311" width="28" height="28" fill="#fff"/>
  <path d="M1052 312 A13 13 0 0 0 1052 338" class="k"/><path d="M1068 312 A13 13 0 0 1 1068 338" class="k"/>
  <text x="1060" y="305" class="ad">%M0</text><text x="1060" y="355" class="sy">NIVEL_OK</text>

  <!-- ============ Rung 2 ============ -->
  <line x1="60" y1="390" x2="1140" y2="390" class="sep"/>
  <text x="80" y="414" class="ttl">Rung 2 — Sensor fotoeléctrico</text>
  <text x="420" y="414" class="cm">Mientras no esté instalado: forzar %I0.1 = 1</text>
  <line x1="60" y1="450" x2="1140" y2="450" class="w"/>
  <rect x="173" y="436" width="14" height="28" fill="#fff"/>
  <line x1="173" y1="436" x2="173" y2="464" class="k"/><line x1="187" y1="436" x2="187" y2="464" class="k"/>
  <text x="180" y="430" class="ad">%I0.1</text><text x="180" y="480" class="sy">FOTO_MOLDE</text>
  <rect x="1046" y="436" width="28" height="28" fill="#fff"/>
  <path d="M1052 437 A13 13 0 0 0 1052 463" class="k"/><path d="M1068 437 A13 13 0 0 1 1068 463" class="k"/>
  <text x="1060" y="430" class="ad">%M1</text><text x="1060" y="480" class="sy">MOLDE_DET</text>

  <!-- ============ Rung 3 ============ -->
  <line x1="60" y1="515" x2="1140" y2="515" class="sep"/>
  <text x="80" y="539" class="ttl">Rung 3 — Nivel bajo confirmado (antirrebote)</text>
  <text x="420" y="539" class="cm">Nivel bajo continuo 2 s → %TM0.Q = 1</text>
  <line x1="60" y1="575" x2="760" y2="575" class="w"/>
  <rect x="173" y="561" width="14" height="28" fill="#fff"/>
  <line x1="173" y1="561" x2="173" y2="589" class="k"/><line x1="187" y1="561" x2="187" y2="589" class="k"/>
  <line x1="169" y1="587" x2="191" y2="563" class="k"/>
  <text x="180" y="555" class="ad">%M0</text><text x="180" y="605" class="sy">NIVEL_OK (negado)</text>
  <rect x="760" y="550" width="200" height="80" class="tm"/>
  <text x="860" y="568" class="bk">%TM0</text>
  <text x="768" y="580" class="pin">IN</text><text x="952" y="580" class="pin" text-anchor="end">Q</text>
  <text x="860" y="618" class="bs">TON · preset 2 s</text>
  <line x1="960" y1="575" x2="990" y2="575" class="w"/>
  <text x="996" y="580" class="pin">→ %TM0.Q (nivel bajo)</text>

  <!-- ============ Rung 4 ============ -->
  <line x1="60" y1="650" x2="1140" y2="650" class="sep"/>
  <text x="80" y="674" class="ttl">Rung 4 — Moldes presentes (retención)</text>
  <text x="420" y="674" class="cm">Se mantiene 5 s después del último molde</text>
  <line x1="60" y1="710" x2="760" y2="710" class="w"/>
  <rect x="173" y="696" width="14" height="28" fill="#fff"/>
  <line x1="173" y1="696" x2="173" y2="724" class="k"/><line x1="187" y1="696" x2="187" y2="724" class="k"/>
  <text x="180" y="690" class="ad">%M1</text><text x="180" y="740" class="sy">MOLDE_DET</text>
  <rect x="760" y="685" width="200" height="80" class="tm"/>
  <text x="860" y="703" class="bk">%TM1</text>
  <text x="768" y="715" class="pin">IN</text><text x="952" y="715" class="pin" text-anchor="end">Q</text>
  <text x="860" y="753" class="bs">TOF · preset 5 s</text>
  <line x1="960" y1="710" x2="990" y2="710" class="w"/>
  <text x="996" y="715" class="pin">→ %TM1.Q (moldes)</text>

  <!-- ============ Rung 5 ============ -->
  <line x1="60" y1="785" x2="1140" y2="785" class="sep"/>
  <text x="80" y="809" class="ttl">Rung 5 — Tiempo máximo de llenado</text>
  <text x="420" y="809" class="cm">Cuenta solo en LLENANDO; al llegar a 30 s → FALLA</text>
  <line x1="60" y1="845" x2="760" y2="845" class="w"/>
  <rect x="135" y="829" width="130" height="32" class="cmp"/><text x="200" y="850" class="bk">%MW0 = 1</text>
  <text x="200" y="877" class="sy">ESTADO = LLENANDO</text>
  <rect x="760" y="820" width="200" height="80" class="tm"/>
  <text x="860" y="838" class="bk">%TM2</text>
  <text x="768" y="850" class="pin">IN</text><text x="952" y="850" class="pin" text-anchor="end">Q</text>
  <text x="860" y="888" class="bs">TON · preset 30 s</text>
  <line x1="960" y1="845" x2="990" y2="845" class="w"/>
  <text x="996" y="850" class="pin">→ %TM2.Q (timeout)</text>

  <!-- ============ Rung 6 ============ -->
  <line x1="60" y1="920" x2="1140" y2="920" class="sep"/>
  <text x="80" y="944" class="ttl">Rung 6 — Reposo en ESPERA</text>
  <text x="420" y="944" class="cm">5 s en ESPERA antes de permitir otro llenado</text>
  <line x1="60" y1="980" x2="760" y2="980" class="w"/>
  <rect x="135" y="964" width="130" height="32" class="cmp"/><text x="200" y="985" class="bk">%MW0 = 0</text>
  <text x="200" y="1012" class="sy">ESTADO = ESPERA</text>
  <rect x="760" y="955" width="200" height="80" class="tm"/>
  <text x="860" y="973" class="bk">%TM3</text>
  <text x="768" y="985" class="pin">IN</text><text x="952" y="985" class="pin" text-anchor="end">Q</text>
  <text x="860" y="1023" class="bs">TON · preset 5 s</text>
  <line x1="960" y1="980" x2="990" y2="980" class="w"/>
  <text x="996" y="985" class="pin">→ %TM3.Q (reposo)</text>

  <!-- ============ Rung 7 ============ -->
  <line x1="60" y1="1055" x2="1140" y2="1055" class="sep"/>
  <text x="80" y="1079" class="ttl">Rung 7 — LLENANDO → FALLA</text>
  <text x="420" y="1079" class="cm">El llenado tardó más de lo permitido</text>
  <line x1="60" y1="1115" x2="880" y2="1115" class="w"/><line x1="1110" y1="1115" x2="1140" y2="1115" class="w"/>
  <rect x="135" y="1099" width="130" height="32" class="cmp"/><text x="200" y="1120" class="bk">%MW0 = 1</text>
  <text x="200" y="1147" class="sy">ESTADO = LLENANDO</text>
  <rect x="333" y="1101" width="14" height="28" fill="#fff"/>
  <line x1="333" y1="1101" x2="333" y2="1129" class="k"/><line x1="347" y1="1101" x2="347" y2="1129" class="k"/>
  <text x="340" y="1095" class="ad">%TM2.Q</text><text x="340" y="1145" class="sy">Timeout</text>
  <rect x="880" y="1099" width="230" height="32" class="op"/><text x="995" y="1120" class="bk">%MW0 := 2</text>

  <!-- ============ Rung 8 ============ -->
  <line x1="60" y1="1180" x2="1140" y2="1180" class="sep"/>
  <text x="80" y="1204" class="ttl">Rung 8 — LLENANDO → ESPERA</text>
  <text x="420" y="1204" class="cm">Se alcanzó el nivel O ya no hay moldes</text>
  <line x1="60" y1="1240" x2="880" y2="1240" class="w"/><line x1="1110" y1="1240" x2="1140" y2="1240" class="w"/>
  <rect x="135" y="1224" width="130" height="32" class="cmp"/><text x="200" y="1245" class="bk">%MW0 = 1</text>
  <text x="200" y="1272" class="sy">ESTADO = LLENANDO</text>
  <polyline points="310,1240 310,1305 470,1305 470,1240" class="w"/>
  <circle cx="310" cy="1240" r="4" fill="#222"/><circle cx="470" cy="1240" r="4" fill="#222"/>
  <rect x="383" y="1226" width="14" height="28" fill="#fff"/>
  <line x1="383" y1="1226" x2="383" y2="1254" class="k"/><line x1="397" y1="1226" x2="397" y2="1254" class="k"/>
  <text x="390" y="1220" class="ad">%M0</text><text x="390" y="1270" class="sy">NIVEL_OK</text>
  <rect x="383" y="1291" width="14" height="28" fill="#fff"/>
  <line x1="383" y1="1291" x2="383" y2="1319" class="k"/><line x1="397" y1="1291" x2="397" y2="1319" class="k"/>
  <line x1="379" y1="1317" x2="401" y2="1293" class="k"/>
  <text x="390" y="1335" class="sy">%TM1.Q negado · sin moldes</text>
  <rect x="880" y="1224" width="230" height="32" class="op"/><text x="995" y="1245" class="bk">%MW0 := 0</text>

  <!-- ============ Rung 9 ============ -->
  <line x1="60" y1="1360" x2="1140" y2="1360" class="sep"/>
  <text x="80" y="1384" class="ttl">Rung 9 — ESPERA → LLENANDO</text>
  <text x="420" y="1384" class="cm">Nivel bajo confirmado Y moldes Y reposo cumplido</text>
  <line x1="60" y1="1420" x2="880" y2="1420" class="w"/><line x1="1110" y1="1420" x2="1140" y2="1420" class="w"/>
  <rect x="135" y="1404" width="130" height="32" class="cmp"/><text x="200" y="1425" class="bk">%MW0 = 0</text>
  <text x="200" y="1452" class="sy">ESTADO = ESPERA</text>
  <rect x="333" y="1406" width="14" height="28" fill="#fff"/>
  <line x1="333" y1="1406" x2="333" y2="1434" class="k"/><line x1="347" y1="1406" x2="347" y2="1434" class="k"/>
  <text x="340" y="1400" class="ad">%TM0.Q</text><text x="340" y="1450" class="sy">Nivel bajo</text>
  <rect x="453" y="1406" width="14" height="28" fill="#fff"/>
  <line x1="453" y1="1406" x2="453" y2="1434" class="k"/><line x1="467" y1="1406" x2="467" y2="1434" class="k"/>
  <text x="460" y="1400" class="ad">%TM1.Q</text><text x="460" y="1450" class="sy">Moldes</text>
  <rect x="573" y="1406" width="14" height="28" fill="#fff"/>
  <line x1="573" y1="1406" x2="573" y2="1434" class="k"/><line x1="587" y1="1406" x2="587" y2="1434" class="k"/>
  <text x="580" y="1400" class="ad">%TM3.Q</text><text x="580" y="1450" class="sy">Reposo</text>
  <rect x="880" y="1404" width="230" height="32" class="op"/><text x="995" y="1425" class="bk">%MW0 := 1</text>

  <!-- ============ Rung 10 ============ -->
  <line x1="60" y1="1485" x2="1140" y2="1485" class="sep"/>
  <text x="80" y="1509" class="ttl">Rung 10 — FALLA → ESPERA (reset)</text>
  <text x="420" y="1509" class="cm">Pulsador de reset O reset desde software / HMI</text>
  <line x1="60" y1="1545" x2="880" y2="1545" class="w"/><line x1="1110" y1="1545" x2="1140" y2="1545" class="w"/>
  <rect x="135" y="1529" width="130" height="32" class="cmp"/><text x="200" y="1550" class="bk">%MW0 = 2</text>
  <text x="200" y="1577" class="sy">ESTADO = FALLA</text>
  <polyline points="310,1545 310,1610 470,1610 470,1545" class="w"/>
  <circle cx="310" cy="1545" r="4" fill="#222"/><circle cx="470" cy="1545" r="4" fill="#222"/>
  <rect x="383" y="1531" width="14" height="28" fill="#fff"/>
  <line x1="383" y1="1531" x2="383" y2="1559" class="k"/><line x1="397" y1="1531" x2="397" y2="1559" class="k"/>
  <text x="390" y="1525" class="ad">%I0.2</text><text x="390" y="1575" class="sy">BTN_RESET</text>
  <rect x="383" y="1596" width="14" height="28" fill="#fff"/>
  <line x1="383" y1="1596" x2="383" y2="1624" class="k"/><line x1="397" y1="1596" x2="397" y2="1624" class="k"/>
  <text x="390" y="1640" class="sy">%M10 · RESET_SW</text>
  <rect x="880" y="1529" width="230" height="32" class="op"/><text x="995" y="1550" class="bk">%MW0 := 0</text>

  <!-- ============ Rung 11 ============ -->
  <line x1="60" y1="1665" x2="1140" y2="1665" class="sep"/>
  <text x="80" y="1689" class="ttl">Rung 11 — Electroválvula</text>
  <text x="420" y="1689" class="cm">Doble seguridad: además del estado, revisa nivel y moldes</text>
  <line x1="60" y1="1725" x2="1140" y2="1725" class="w"/>
  <rect x="135" y="1709" width="130" height="32" class="cmp"/><text x="200" y="1730" class="bk">%MW0 = 1</text>
  <text x="200" y="1757" class="sy">ESTADO = LLENANDO</text>
  <rect x="333" y="1711" width="14" height="28" fill="#fff"/>
  <line x1="333" y1="1711" x2="333" y2="1739" class="k"/><line x1="347" y1="1711" x2="347" y2="1739" class="k"/>
  <line x1="329" y1="1737" x2="351" y2="1713" class="k"/>
  <text x="340" y="1705" class="ad">%M0</text><text x="340" y="1755" class="sy">NIVEL_OK (negado)</text>
  <rect x="453" y="1711" width="14" height="28" fill="#fff"/>
  <line x1="453" y1="1711" x2="453" y2="1739" class="k"/><line x1="467" y1="1711" x2="467" y2="1739" class="k"/>
  <text x="460" y="1705" class="ad">%TM1.Q</text><text x="460" y="1755" class="sy">Moldes</text>
  <rect x="1046" y="1711" width="28" height="28" fill="#fff"/>
  <path d="M1052 1712 A13 13 0 0 0 1052 1738" class="k"/><path d="M1068 1712 A13 13 0 0 1 1068 1738" class="k"/>
  <text x="1060" y="1705" class="ad">%Q1.0</text><text x="1060" y="1755" class="sy">EV_LLENADO</text>

  <!-- ============ Rung 12 ============ -->
  <line x1="60" y1="1790" x2="1140" y2="1790" class="sep"/>
  <text x="80" y="1814" class="ttl">Rung 12 — Lámpara de falla</text>
  <text x="420" y="1814" class="cm">Parpadea con el reloj de 1 s del sistema (%S6)</text>
  <line x1="60" y1="1850" x2="1140" y2="1850" class="w"/>
  <rect x="135" y="1834" width="130" height="32" class="cmp"/><text x="200" y="1855" class="bk">%MW0 = 2</text>
  <text x="200" y="1882" class="sy">ESTADO = FALLA</text>
  <rect x="333" y="1836" width="14" height="28" fill="#fff"/>
  <line x1="333" y1="1836" x2="333" y2="1864" class="k"/><line x1="347" y1="1836" x2="347" y2="1864" class="k"/>
  <text x="340" y="1830" class="ad">%S6</text><text x="340" y="1880" class="sy">Reloj 1 s</text>
  <rect x="1046" y="1836" width="28" height="28" fill="#fff"/>
  <path d="M1052 1837 A13 13 0 0 0 1052 1863" class="k"/><path d="M1068 1837 A13 13 0 0 1 1068 1863" class="k"/>
  <text x="1060" y="1830" class="ad">%Q1.1</text><text x="1060" y="1880" class="sy">LAMP_FALLA</text>

  <!-- Notas -->
  <line x1="60" y1="1905" x2="1140" y2="1905" class="sep"/>
  <text x="60" y="1932" class="sub">Timers (Tools → Software Objects → Timers, base 1 s): %TM0 TON 2 · %TM1 TOF 5 · %TM2 TON 30 · %TM3 TON 5</text>
  <text x="60" y="1954" class="sub">El orden importa: las salidas de LLENANDO (Rungs 7–8) van antes de la entrada (Rung 9), así no hay rebotes de estado en un mismo scan.</text>
  <text x="60" y="1976" class="sub">Equivalente en texto IL para pegar: plc/fsm_llenado_v1.il</text>
</svg>
